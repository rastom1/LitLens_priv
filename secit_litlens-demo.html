<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0} img{max-width:100%}</style>
<title>LitLens Mock Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: browser page on the left, Chrome-style side panel on the right; stacks on phones. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --fg: #161a22;
  --muted: #5a6271;
  --line: #d8dce4;
  --accent: #3345c2;
  --accent-soft: #e4e7fa;
  --support: #157a4b;
  --support-soft: #dcf0e4;
  --attack: #bd3720;
  --attack-soft: #fbe2da;
  --warn: #8a5e00;
  --warn-soft: #f8edcf;
  --dim: 0.32;
  --f-read: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b0; --line: #2a303b;
    --accent: #8f9dff; --accent-soft: #232a4d; --support: #52cc8e; --support-soft: #173328;
    --attack: #ff8d72; --attack-soft: #3a211b; --warn: #e6b74c; --warn-soft: #352b13; --dim: 0.28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --surface-2: #1d222c; --fg: #e7eaf0; --muted: #98a1b0; --line: #2a303b;
  --accent: #8f9dff; --accent-soft: #232a4d; --support: #52cc8e; --support-soft: #173328;
  --attack: #ff8d72; --attack-soft: #3a211b; --warn: #e6b74c; --warn-soft: #352b13; --dim: 0.28;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.brand .lens { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); align-self: center; }
.brand .lens::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.mockpill { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); background: var(--warn-soft); padding: 2px 6px; border-radius: 4px; }
form.url { flex: 1 1 360px; display: flex; gap: 8px; min-width: 0; }
.url-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; }
.url-field svg { flex: none; color: var(--muted); }
.url-field input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; font-family: var(--f-mono); font-size: 12.5px; }
.url-field input:focus { outline: none; }
.url-field:focus-within { border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.samples { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; color: var(--fg); }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.err { border-style: dashed; color: var(--muted); }

/* ---------- workspace ---------- */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 430px); min-height: 0; }
.page-pane { overflow: auto; padding-block: 28px 56px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; }
.panel { overflow: auto; background: var(--surface); border-left: 1px solid var(--line); padding-block: 18px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* ---------- article ---------- */
.sheet { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12.5px; color: var(--muted); padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.legend .sw { display: inline-flex; align-items: center; gap: 6px; }
.legend .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--fg); }
.kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.kicker .sec { color: var(--accent); }
h1.headline { font-family: var(--f-read); font-weight: 600; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.byline { font-size: 13px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.byline .mono { font-family: var(--f-mono); font-size: 12px; }
.body { font-family: var(--f-read); font-size: 19px; line-height: 1.7; display: flex; flex-direction: column; gap: 1.05em; }
.body p { margin: 0; max-width: 64ch; }

mark.hl { color: inherit; border-radius: 3px; padding: 1px 2px; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
  --hl: transparent; background-color: transparent; background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat; background-size: 100% 100%;
  transition: opacity .15s, box-shadow .15s, background-size .5s cubic-bezier(.3,.7,.2,1), text-decoration-color .35s ease .25s; }
mark.hl.main { --hl: var(--accent-soft); text-decoration-color: var(--accent); text-decoration-thickness: 3px; }
mark.hl.support { --hl: var(--support-soft); text-decoration-color: var(--support); }
mark.hl.attack { --hl: var(--attack-soft); text-decoration-color: var(--attack); text-decoration-style: wavy; text-decoration-thickness: 1.5px; }
mark.hl.low { background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--warn) 22%, transparent) 5px 7px), linear-gradient(var(--hl), var(--hl)); }
mark.hl .tag { transition: opacity .25s ease, transform .25s ease; }
/* animated reveal: highlighter sweep in reading order */
.revealing mark.hl:not(.in) { background-size: 0% 100%; text-decoration-color: transparent; cursor: text; }
.revealing mark.hl:not(.in) .tag { opacity: 0; transform: translateY(3px); }
#panel .card, #panel .maincard { transition: opacity .3s ease, transform .3s ease, border-color .15s; }
#panel.revealing .card:not(.in), #panel.revealing .maincard:not(.in) { opacity: 0; transform: translateY(6px); }
#panel.revealing .tree li:not(.in)::after { opacity: 0; }
.tree li::after { transition: opacity .3s ease; }
.replay { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 4px; }
.replay:hover { background: var(--accent-soft); }
.tag { font-family: var(--f-ui); font-size: 11px; font-weight: 600; line-height: 1; padding: 3px 5px 2px; border-radius: 4px; border: 1px solid currentColor; background: var(--surface); white-space: nowrap; display: inline-block; vertical-align: 0.15em; }
mark.hl .tag { margin-right: 5px; font-family: var(--f-ui); font-size: 11px; font-weight: 600; text-decoration: none; }
.tag.main { color: var(--accent); }
.tag.support { color: var(--support); }
.tag.attack { color: var(--attack); }
.tag.none { color: var(--muted); }

mark.hl.hover, mark.hl.active { box-shadow: 0 0 0 2px var(--fg); }
mark.hl.path:not(.active) { box-shadow: 0 0 0 1.5px var(--muted); }
.focusing mark.hl:not(.active):not(.related) { opacity: var(--dim); }
.no-hl mark.hl { background: none; text-decoration-line: none; cursor: text; }
.no-hl mark.hl .tag { display: none; }
[data-filter="support"] mark.hl.attack, [data-filter="attack"] mark.hl.support { background: none; text-decoration-line: none; }
[data-filter="support"] mark.hl.attack .tag, [data-filter="attack"] mark.hl.support .tag { display: none; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 2px var(--fg); } 50% { box-shadow: 0 0 0 5px var(--fg); } }
mark.hl.flash { animation: flash .7s ease 2; }

.simnote { font-size: 12px; color: var(--muted); text-align: center; border-top: 1px dashed var(--line); padding-top: 14px; }
.simnote a { color: var(--accent); }
.realpill { color: var(--support); background: var(--support-soft); border-radius: 4px; padding: 0 6px; letter-spacing: 0.06em; }

/* ---------- panel ---------- */
.p-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.p-head h2 { font-size: 15px; margin: 0; font-weight: 600; margin-right: auto; }
.status { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--support-soft); color: var(--support); }
.status.partial { background: var(--warn-soft); color: var(--warn); }
.meta { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn { font-size: 12.5px; background: var(--warn-soft); color: var(--fg); border-radius: 6px; padding: 8px 10px; display: flex; gap: 8px; }
.warn b { color: var(--warn); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.04em; flex: none; padding-top: 2px; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.label .n { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0; }

.maincard { background: var(--accent-soft); border: 1px solid transparent; border-radius: 10px; padding: 14px; cursor: pointer; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.maincard:hover, .maincard.hover { border-color: var(--accent); }
.maincard.active { border-color: var(--fg); }
.maincard .quote { font-family: var(--f-read); font-size: 18px; line-height: 1.4; margin: 0; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--fg); font-weight: 600; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); align-self: flex-start; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.group { display: flex; flex-direction: column; gap: 8px; }
.group .label .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0.05em; }
.group.sup .dot { background: var(--support); }
.group.att .dot { background: var(--attack); }
.empty { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.node { display: flex; flex-direction: column; gap: 8px; }
.children { display: flex; flex-direction: column; gap: 8px; margin-left: 12px; padding-left: 12px; border-left: 2px solid var(--line); }
.card { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: opacity .15s, border-color .15s; }
.card:hover, .card.hover { border-color: var(--muted); }
.card.active { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.card.related { border-color: var(--muted); }
.card.path, .maincard.path { border-color: var(--fg); border-style: dashed; }
.tree li.onpath::after { border-top-width: 3.5px; }
.focusing .tree li:not(.onpath)::after { opacity: 0.45; }
.pathbar { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.pathbar-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pathbar ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pathbar li { display: inline-flex; align-items: center; gap: 4px; }
.pathbar li + li::before { content: "›"; color: var(--muted); padding: 0 2px; }
.pathbar button.step { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.pathbar button.step:hover { border-color: var(--muted); }
.pathbar button.step.cur { border-color: var(--fg); font-weight: 600; }
.pathbar .r { font-size: 11px; font-weight: 600; }
.pathbar .r.support { color: var(--support); }
.pathbar .r.attack { color: var(--attack); }
.pathbar .net { font-size: 12px; color: var(--muted); }
.pathbar .net b { color: var(--fg); font-weight: 600; }
.focusing .card:not(.active):not(.related), .focusing .maincard:not(.active):not(.related) { opacity: 0.55; }
[data-filter="support"] li[data-rel="attack"] > .card, [data-filter="attack"] li[data-rel="support"] > .card { opacity: 0.4; }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.card-top .rel { font-weight: 500; }
.card-top .rel.support { color: var(--support); }
.card-top .rel.attack { color: var(--attack); }
.conf { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.conf .track { width: 34px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.conf .track i { display: block; height: 100%; background: var(--muted); }
.card .quote { font-family: var(--f-read); font-size: 15.5px; line-height: 1.45; margin: 0; }
.card-foot { display: flex; gap: 6px 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.lowflag { color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 6px; font-weight: 500; }

.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { margin-left: 14px; }
.tree ul { margin-left: 18px; }
.tree li { position: relative; padding: 10px 0 0 22px; }
.tree li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.tree li:last-child::before { bottom: auto; height: 31px; }
.tree li::after { content: ""; position: absolute; left: 0; top: 30px; width: 18px; border-top: 2px solid var(--line); }
.tree li[data-rel="support"]::after { border-top-color: var(--support); }
.tree li[data-rel="attack"]::after { border-top-color: var(--attack); border-top-style: dashed; }
.tree li > .card { position: relative; }
.kind { font-size: 13px; font-weight: 600; }
.relword { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 6px; }
.relword::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.relword.support { color: var(--support); }
.relword.attack { color: var(--attack); }
.relword.attack::before { border-radius: 1px; transform: rotate(45deg); }
.card-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 0; }
.queries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.queries a { display: flex; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.queries a:hover { background: var(--surface-2); }
.queries a svg { flex: none; color: var(--muted); }
details.raw summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
details.raw .rawbar { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 6px; gap: 8px; }
details.raw pre { margin: 0; max-height: 320px; overflow: auto; font-family: var(--f-mono); font-size: 11px; line-height: 1.5; background: var(--surface-2); border-radius: 8px; padding: 10px; }

/* loading + error */
.skel { display: flex; flex-direction: column; gap: 12px; }
.skel i { display: block; height: 14px; border-radius: 4px; background: var(--surface-2); }
.skel i.h { height: 30px; width: 80%; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.steps li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.steps li.on { color: var(--fg); }
.steps li.done { color: var(--support); }
.steps li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.steps li.done::before { background: currentColor; }
@keyframes pulse { 50% { opacity: .45; } }
.skel i, .steps li.on::before { animation: pulse 1.1s ease-in-out infinite; }
.errcard { border: 1px solid var(--attack); background: var(--attack-soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.errcard h3 { margin: 0; font-size: 14px; }
.errcard p { margin: 0; font-size: 13px; }
.blank { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 10px; font-size: 14px; }

/* graph view */
.viewrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
@media (min-width: 901px) { .workspace.graph-mode { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); } }
.graphwrap { position: relative; height: max(420px, calc(100vh - 300px)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
#cy { position: absolute; inset: 0; }
.gctrl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.gctrl .iconbtn { background: var(--surface); border: 1px solid var(--line); }
.glegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.glegend span { display: inline-flex; align-items: center; gap: 6px; }
.glegend i { display: inline-block; width: 22px; border-top: 2px solid; }
.glegend i.s { border-color: var(--support); }
.glegend i.a { border-color: var(--attack); border-top-style: dashed; }
.glegend i.l { width: 14px; height: 10px; border: 1.5px dashed var(--muted); border-radius: 3px; }
.gfail { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

/* paste / upload dialog */
dialog.paste { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog.paste::backdrop { background: rgba(10, 12, 18, 0.55); }
.pd { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.pd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pd-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.pd-head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.iconbtn { border: 0; background: transparent; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--surface-2); color: var(--fg); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 500; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

/* ---------- interaction: hover + select ---------- */
const all = id => document.querySelectorAll(`[data-id="${CSS.escape(id)}"]:is(mark, .card, .maincard)`);

    const rel = IX.parent.get(id); if (rel && rel.type === "attack") flips++;
    return `<li><button type="button" class="step${id === active ? " cur" : ""}" data-step="${esc(id)}">${labelOf(id)}${rel ? ` <span class="r ${rel.type}">${rel.type === "support" ? "supports" : "attacks"}</span>` : ""}</button></li>`;
  }).join("");

  const net = !reachesMain ? "Not linked to the main claim" : active === CUR.main_claim_id ? "This is the main claim" :

/* ---------- animated reveal ---------- */
let revealTimers = [];
function revealOrder() {
  // main claim first, then everything else in reading order
  const ids = [...CUR.components].sort((a, b) => a.start - b.start).map(c => c.id).filter(id => id !== CUR.main_claim_id);

}
function revealOne(id) {

  if (cy) {
    const n = cy.getElementById(id);
    if (n.nonempty()) { n.removeClass("pre"); n.connectedEdges().forEach(e => { if (e.data("target") === id || e.data("source") === id && !e.target().hasClass("pre")) e.removeClass("pre"); }); }
  }
}
function finishReveal() {
  revealTimers.forEach(clearTimeout); revealTimers = [];
  $("#pagePane").classList.remove("revealing"); $("#panel").classList.remove("revealing");
  document.querySelectorAll("mark.hl, #panel .card, #panel .maincard, #panel li").forEach(el => el.classList.add("in"));
  if (cy) cy.elements().removeClass("pre");
}
function startReveal() {
  revealTimers.forEach(clearTimeout); revealTimers = [];
  if (!CUR || matchMedia("(prefers-reduced-motion: reduce)").matches) { finishReveal(); return; }
  document.querySelectorAll("mark.hl, #panel .card, #panel .maincard, #panel li").forEach(el => el.classList.remove("in"));
  $("#pagePane").classList.add("revealing"); $("#panel").classList.add("revealing");
  if (cy) cy.elements().addClass("pre");
  const order = revealOrder();
  const step = Math.max(90, Math.min(220, 2600 / order.length));
  order.forEach((id, i) => revealTimers.push(setTimeout(() => revealOne(id), 250 + i * step)));
  revealTimers.push(setTimeout(finishReveal, 250 + order.length * step + 600));
}
function showError(url) {

  $("#pagePane").innerHTML = `<div class="sheet"><div class="blank">The page at <span class="meta">${esc(url || "(empty)")}</span> has no article LitLens can read.</div></div>`;
  $("#panel").innerHTML = `
    <div class="p-head"><h2>Argument map</h2><span class="status partial">No result</span></div>
    <div class="errcard" role="alert">
      <h3>No article found on this page</h3>

}
let timers = [];
function analyze(url) { runAnalysis(byUrl.get(norm(url)), url); }
function runAnalysis(resp, url) {
  timers.forEach(clearTimeout); timers = [];
  const btn = $("#analyzeBtn"); btn.disabled = true; btn.textContent = "Analyzing…";
  const steps = ["Extracting article text", "Classifying claims and premises", "Linking support and attack relations"];
  $("#pagePane").innerHTML = `<div class="sheet skel" aria-hidden="true"><i style="width:30%"></i><i class="h"></i><i class="h" style="width:55%"></i><i></i><i></i><i style="width:92%"></i><i></i><i style="width:70%"></i></div>`;
  $("#panel").innerHTML = `<div class="p-head"><h2>Argument map</h2><span class="meta">Analyzing…</span></div><ul class="steps" aria-live="polite">${steps.map(s => `<li>${s}</li>`).join("")}</ul><div class="skel"><i class="h" style="width:100%"></i><i></i><i style="width:80%"></i></div>`;
  const lis = () => $("#panel").querySelectorAll(".steps li");

  step(0);

/* ---------- keyword-rule annotator for pasted text (stands in for the model) ---------- */
const MAX_WORDS = 5000;
const RX = {
  claim: /\b(should|must|ought to|need(?:s)? to|has to|have to|is (?:a )?(?:mistake|wrong|right|failure|disaster|essential|necessary|vital)|it is time|the truth is|clearly|undeniabl[ey]|we believe|i believe|i think|argue[sd]?|will (?:not|never)|cannot|can't|is the best|is the worst|deserve[sd]?|matters?\b)/gi,
  evidence: /(\bbecause\b|\bsince\b|according to|\bstud(?:y|ies)\b|\breport(?:s|ed)?\b|\bsurvey\b|\bdata\b|\bpoll\b|\bresearch\b|\bfound\b|\bshows?\b|\bsaid\b|\bper ?cent\b|%|\$\s?\d|\b\d[\d,.]*\s?(?:million|billion|thousand|people|years?|times)\b|\bfor example\b|\bfor instance\b|\brecords?\b)/gi,
  concede: /^(?:\W*)(?:critics|opponents|some (?:argue|say|claim|people)|others (?:argue|say|point)|supporters (?:say|argue)|skeptics|detractors|it is true that|admittedly|of course|although|while some)\b/i,
  contrast: /^(?:\W*)(?:but|however|yet|still|nevertheless|nonetheless|that said|on the other hand|even so|in fact|in reality)\b/i,
  conclude: /^(?:\W*)(?:therefore|thus|so|in short|in the end|ultimately|overall|that is why|this is why)\b/i,
};
const countRx = (rx, s) => (s.match(rx) || []).length;
function hash01(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }
const conf = (base, s) => Math.max(0.42, Math.min(0.93, +(base + (hash01(s) - 0.5) * 0.16).toFixed(2)));

function normalizeText(raw) {
  let txt = raw.replace(/\r\n?/g, "\n").replace(/[ \t]+/g, " ").trim();
  let paras = txt.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  if (paras.length === 1 && txt.includes("\n")) paras = txt.split(/\n/).map(p => p.trim()).filter(Boolean);
  const words = paras.join(" ").split(/\s+/).length;
  let truncated = false;
  if (words > MAX_WORDS) {
    truncated = true; let left = MAX_WORDS; const keep = [];
    for (const p of paras) { const w = p.split(/\s+/); if (left <= 0) break; keep.push(w.slice(0, left).join(" ")); left -= w.length; }
    paras = keep;
  }
  return { text: paras.join("\n\n"), truncated };
}

function annotate(raw, headline, sourceLabel, origin) {
  const { text, truncated } = normalizeText(raw);
  // sentences with offsets, per paragraph
  const sents = []; let off = 0;
  text.split("\n\n").forEach((p, pi) => {
    const pieces = []; const bx = /[.!?]+["”’)\]]*(?=\s|$)/g; let bm, from = 0;
    while ((bm = bx.exec(p))) {
      const before = p.slice(from, bm.index + 1);
      if (/(?:^|[\s(])(?:[A-Z]\.){1,3}$|\b(?:Mr|Mrs|Ms|Dr|St|Jr|Sr|vs|Gov|Sen|Rep|Prof|Gen|Lt|No)\.$/.test(before) && bm[0] === ".") continue;
      pieces.push({ index: from, 0: p.slice(from, bm.index + bm[0].length) }); from = bm.index + bm[0].length;
    }
    if (from < p.length) pieces.push({ index: from, 0: p.slice(from) });
    for (const m of pieces) {
      const rawS = m[0]; const lead = rawS.length - rawS.trimStart().length;
      let s = rawS.trim().replace(/^["“‘(]+/, ""); const startShift = rawS.trim().length - s.length;
      s = s.replace(/[.!?]+["”’)\]]*$/, "").trim();
      if (s.split(/\s+/).length < 5) continue;
      const start = off + m.index + lead + startShift;
      sents.push({ pi, text: s, start, end: start + s.length,
        c: countRx(RX.claim, s), e: countRx(RX.evidence, s),
        concede: RX.concede.test(s), contrast: RX.contrast.test(s), conclude: RX.conclude.test(s) });
    }
    off += p.length + 2;
  });
  if (!sents.length) return null;
  const titleWords = new Set((headline || "").toLowerCase().match(/[a-z]{4,}/g) || []);
  const overlap = s => (s.toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => titleWords.has(w)).length;
  // main claim: strongest claim-like sentence, favouring the opening and the headline
  let best = sents[0], bestScore = -1;
  sents.forEach((s, i) => {
    const score = s.c * 2 - s.e * 0.5 + overlap(s.text) * 1.5 + (s.pi === 0 ? 1.5 : 0) + (s.conclude ? 1 : 0) - (s.concede ? 3 : 0) - i * 0.05;
    if (score > bestScore) { bestScore = score; best = s; }

  comps.push({ id: mainId, type: "claim", start: best.start, end: best.end, text: best.text, confidence: conf(0.62 + Math.min(best.c, 3) * 0.08, best.text) });
  const idOf = new Map([[best, mainId]]), typeOf = new Map([[mainId, "claim"]]), relOf = new Map();
  let lastTop = null, paraHead = null, paraAttack = null, curPara = -1;
  for (const s of sents) {
    if (s.pi !== curPara) { curPara = s.pi; paraHead = null; paraAttack = null; }
    if (s === best) continue;
    const argumentative = s.c || s.e || s.concede || s.contrast || s.conclude;
    if (!argumentative || comps.length >= 24) continue;
    const isClaim = s.c > s.e || (s.concede && !s.e) || s.conclude;
    let target = mainId, type = "support";
    if (s.concede) { target = mainId; type = "attack"; }
    else if (s.contrast && paraAttack) { target = paraAttack; type = "attack"; }
    else if (s.contrast && !paraHead && lastTop && relOf.get(lastTop) === "attack") { target = lastTop; type = "attack"; }
    else if (!isClaim && paraHead) { target = paraHead; type = "support"; }

    comps.push({ id, type: isClaim ? "claim" : "premise", start: s.start, end: s.end, text: s.text,

    rels.push({ id: `R${rels.length + 1}`, source: id, target, type, confidence: conf(target === mainId ? 0.62 : 0.58, s.text + target) });
    idOf.set(s, id); typeOf.set(id, isClaim ? "claim" : "premise"); relOf.set(id, type);

    if (!paraHead) paraHead = id;

  }
  const lowC = comps.filter(c => c.confidence < LOW).length, lowR = rels.filter(r => r.confidence < LOW).length;
  const warnings = [{ code: "KEYWORD_RULES", message: "No model is connected. These labels come from simple keyword rules, so expect mistakes." }];
  if (lowC || lowR) warnings.push({ code: "LOW_CONFIDENCE", message: `${lowC} component${lowC === 1 ? "" : "s"} and ${lowR} relation${lowR === 1 ? "" : "s"} scored below 0.60.` });
  if (truncated) warnings.push({ code: "TRUNCATED", message: "The text was over 5,000 words, so only the first 5,000 were analyzed." });
  if (rels.length === 0) warnings.push({ code: "FEW_ARGUMENTS", message: "LitLens found no premises. The text may be news reporting rather than argument." });
  return {
    schema_version: "1.0", request_id: "req_local_" + Math.floor(hash01(text) * 1e8).toString(16), status: "complete",
    model: { name: "keyword-rules", version: "0.0-local", component_head: "claim/premise/none", relation_head: "support/attack/none" },
    latency_ms: 1400, warnings,
    article: { url: "", title: headline || "Untitled article", source: sourceLabel, author: "", published_at: "", section: "", origin,
      is_mock: true, word_count: text.split(/\s+/).length, truncated, text },
    main_claim_id: mainId, components: comps.sort((a, b) => a.start - b.start), relations: rels, suggested_queries: [],
  };
}

/* ---------- paste / upload dialog ---------- */
const dlg = $("#pasteDlg"), pdText = $("#pdText"), pdErr = $("#pdErr");
let pdSource = { label: "Pasted text", origin: "pasted" };
function pdCount() {

  const el = $("#pdCount"); el.textContent = `${n.toLocaleString()} / 5,000 words`; el.classList.toggle("over", n > MAX_WORDS);
  if (n > MAX_WORDS) el.textContent += " · extra will be cut";
}

  pdText.focus();
}

function extractHTML(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script, style, nav, header, footer, aside, noscript, figure, form").forEach(n => n.remove());
  const scope = doc.querySelector("article") || doc.querySelector("main") || doc.body;
  const ps = [...scope.querySelectorAll("p")].map(p => p.textContent.replace(/\s+/g, " ").trim()).filter(s => s.split(" ").length > 4);
  const title = (doc.querySelector("h1")?.textContent || doc.title || "").replace(/\s+/g, " ").trim();
  return { title, text: ps.length ? ps.join("\n\n") : (scope.textContent || "").trim() };
}
function loadFile(file) {
  if (!file) return;
  const name = file.name || "file"; const ext = (name.split(".").pop() || "").toLowerCase();
  if (!["txt", "md", "markdown", "html", "htm"].includes(ext) && !/^text\//.test(file.type)) {
    pdError(`LitLens can't read ${ext ? "." + ext : "this kind of"} files yet. Upload a .txt, .md or .html file, or copy the text from a PDF or Word file and paste it here.`);
    return;
  }
  if (file.size > 3 * 1024 * 1024) { pdError("That file is over 3 MB. Upload a smaller file or paste the article text."); return; }

  r.onerror = () => pdError("LitLens couldn't read that file. Try again or paste the text instead.");
  r.onload = () => {
    let text = String(r.result || ""), title = "";
    if (ext === "html" || ext === "htm" || /html/.test(file.type)) ({ title, text } = extractHTML(text));
    else {
      text = text.replace(/^﻿/, "");
      const lines = text.replace(/\r\n?/g, "\n").split("\n");
      const firstLine = lines[0].replace(/^#+\s*/, "").trim();
      if (firstLine && firstLine.length < 140 && !/[.!?]$/.test(firstLine) && lines.length > 1) { title = firstLine; text = lines.slice(1).join("\n"); }
      text = text.replace(/^#+\s*/gm, "").replace(/[*_]{1,2}([^*_]+)[*_]{1,2}/g, "$1");
    }
    pdText.value = text.trim();
    if (title && !$("#pdHeadline").value.trim()) $("#pdHeadline").value = title;
    pdSource = { label: name, origin: "upload" };
    $("#pdFileName").textContent = name;
    pdCount(); pdError(pdText.value.trim() ? "" : "That file has no readable text.");
  };
  r.readAsText(file);
}
$("#pdUpload").addEventListener("click", () => $("#pdFile").click());
$("#pdFile").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });
const drop = $("#pdDrop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f); });

$("#pasteForm").addEventListener("submit", e => {
  e.preventDefault();
  const raw = pdText.value.trim();
